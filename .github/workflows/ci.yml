name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-sqlite:
    name: 后端快速门禁（Python 3.12 / SQLite）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 安装后端依赖
        run: python -m pip install -r backend/requirements.txt
      - name: Python py_compile
        run: git ls-files -z -- '*.py' | xargs -0 python -m py_compile
      - name: SQLite 全量单测
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
        run: |
          python -m unittest discover -s backend/tests -p 'test_*.py' -v
          python -m unittest discover -s scripts/ops/tests -p 'test_*.py' -v
      - name: 黄金前缀不变与重现门禁
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
        shell: bash
        run: |
          for pattern in test_quant_trust_contract.py test_research_reproduction.py test_sentinel_baseline.py; do
            if [[ -f "backend/tests/$pattern" ]]; then
              python -m unittest discover -s backend/tests -p "$pattern" -v
            fi
          done

  postgresql-integration:
    name: PostgreSQL 16 集成矩阵
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 安装后端依赖
        run: python -m pip install -r backend/requirements.txt
      - name: 空库、baseline、质量、快照、runner 与 worker lease
        env:
          PYTHON_BIN: python
          APP_GIT_COMMIT: ${{ github.sha }}
        run: scripts/ops/test_postgres_integration.sh

  frontend:
    name: 前端常规门禁（Node 22 Alpine）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建正式前端镜像
        run: docker build --file frontend/Dockerfile --tag quant-frontend-ci .
      - name: TypeScript、ESLint 与生产构建
        run: docker run --rm quant-frontend-ci sh -lc 'npm run typecheck && npm run lint && npm run build'

  repository-gates:
    name: Compose、Shell 与差异检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Docker Compose 配置
        run: |
          docker compose config >/dev/null
          docker compose --file docker-compose.test.yml config >/dev/null
          scripts/ops/test_new_server_runtime.sh
          scripts/ops/test_private_https_config.sh
      - name: 运维 Shell 语法
        shell: bash
        run: |
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print | LC_ALL=C sort)
      - name: Git 差异空白检查
        shell: bash
        run: |
          git diff --check
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          fi
