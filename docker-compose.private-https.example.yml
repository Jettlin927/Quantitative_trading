services:
  frontend:
    networks:
      - default
      - private_https_origin

  cloudflared:
    image: cloudflare/cloudflared:2026.7.2@sha256:4f6655284ab3d252b7f28fedb19fe6c8fc82ee5b1295c20ac74d475e5398a52d
    container_name: quant_trading_cloudflared
    user: "65532:65532"
    command:
      - tunnel
      - --metrics
      - 127.0.0.1:2000
      - --loglevel
      - info
      - --transport-loglevel
      - warn
      - run
      - --token-file
      - /run/secrets/cloudflared-tunnel-token
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
    volumes:
      - type: bind
        source: /srv/quantitative-trading/secrets/cloudflared-tunnel-token
        target: /run/secrets/cloudflared-tunnel-token
        read_only: true
        bind:
          create_host_path: false
    networks:
      private_https_egress:
        gw_priority: 1
      private_https_origin:
        gw_priority: 0
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 0.15
    mem_limit: 192m
    mem_reservation: 64m
    pids_limit: 64
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "/usr/local/bin/cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

networks:
  private_https_origin:
    internal: true
  private_https_egress:
