services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quant_migration_test
      POSTGRES_USER: quant_test
      POSTGRES_PASSWORD: quant_test_password
      POSTGRES_INITDB_ARGS: --no-sync
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-0}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant_test -d quant_migration_test"]
      interval: 2s
      timeout: 3s
      retries: 30
